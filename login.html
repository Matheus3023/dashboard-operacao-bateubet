<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Bateu Bet · Login</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#0A0308;
    --bg-2:#4A0E2E;
    --surface:#33101F;
    --surface-2:#4A0E2E;
    --line:rgba(255,255,255,.14);
    --line-strong:rgba(255,255,255,.24);
    --txt:#FFFFFF;
    --txt-2:rgba(255,255,255,.72);
    --txt-3:rgba(255,255,255,.50);
    --acao:#D81B60;
    --acao-2:#C2185B;
    --gold:#E8B23D;
    --gold-2:#D4AF37;
    --bad:#FF4D4D;
    --bad-soft:rgba(255,77,77,.15);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--sans);
    color:var(--txt);
    background:
      radial-gradient(1000px 640px at 88% -8%, rgba(232,178,61,.14), transparent 58%),
      linear-gradient(165deg, rgba(74,14,46,.88) 0%, rgba(10,3,8,.94) 62%),
      url('login-fundo.jpg');
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:360px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:32px 28px 28px;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    text-align:center;
  }
  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:24px;
  }
  .brand img{height:24px;width:auto;display:block}
  h1{
    font-size:1.125rem;
    font-weight:700;
    margin:0 0 6px;
    letter-spacing:-.01em;
  }
  p.sub{
    font-size:.75rem;
    color:var(--txt-2);
    line-height:1.5;
    margin:0 0 22px;
  }
  p.sub b{color:var(--gold);font-weight:600}
  .btn-google{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:13px 18px;
    border-radius:999px;
    border:1px solid var(--line-strong);
    background:#fff;
    color:#1f1f1f;
    font:inherit;
    font-size:.875rem;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
    transition:filter .14s ease, transform .14s ease;
  }
  .btn-google:hover{filter:brightness(.96)}
  .btn-google:active{transform:scale(.99)}
  .btn-google svg{width:18px;height:18px;flex:none}
  .erro{
    display:none;
    margin:0 0 18px;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid rgba(255,77,77,.35);
    background:var(--bad-soft);
    color:#ffb3b3;
    font-size:.75rem;
    line-height:1.45;
    text-align:left;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="brand">
      <img src="logo-bateubet.svg" alt="Bateu Bet" width="112" height="24">
    </div>

    <h1>Acesso restrito</h1>
    <p class="sub">Só com conta Google <b>@bateubet.com</b>.</p>

    <p class="erro" id="erro-msg"></p>

    <a class="btn-google" id="btn-entrar" href="/api/auth/start">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.9-2.26 5.36-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Entrar com o Google
    </a>
  </div>

<script>
  /* mensagem de erro vem por querystring, escrita pelo callback do OAuth
     (ver api/auth/callback.js) -- nunca do lado do cliente, só refletindo o
     que o servidor decidiu. */
  var MSGS = {
    fora_do_dominio: 'Essa conta não é do workspace da Bateu Bet (@bateubet.com). Entre com a conta certa.',
    state_invalido: 'A sessão de login expirou ou foi reaberta em outra aba. Tenta de novo.',
    token_negado: 'O Google não confirmou o login. Tenta de novo.',
    token_invalido: 'Não deu pra confirmar sua identidade. Tenta de novo.',
    verificacao_falhou: 'Não deu pra confirmar o login com o Google agora. Tenta de novo em instantes.',
    google_indisponivel: 'O Google não respondeu agora. Tenta de novo em instantes.',
    access_denied: 'Login cancelado.'
  };
  (function () {
    var p = new URLSearchParams(location.search);
    var erro = p.get('erro');
    if (!erro) return;
    var el = document.getElementById('erro-msg');
    el.textContent = MSGS[erro] || 'Não deu pra entrar agora. Tenta de novo.';
    el.style.display = 'block';
  })();

  /* preserva pra onde a pessoa queria ir (ver middleware.js) através do login,
     sem colocar isso na URL do Google -- o start.js guarda num cookie curto. */
  (function () {
    var p = new URLSearchParams(location.search);
    var voltar = p.get('voltar');
    if (voltar) {
      document.getElementById('btn-entrar').href =
        '/api/auth/start?voltar=' + encodeURIComponent(voltar);
    }
  })();
</script>

</body>
</html>
